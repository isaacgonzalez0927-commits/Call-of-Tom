name: Collision regression tests
on:
  push:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/collision-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/collision-tests.yml'
jobs:
  collision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
