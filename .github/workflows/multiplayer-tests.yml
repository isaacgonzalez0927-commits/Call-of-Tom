name: Multiplayer smoke tests
on:
  push:
    paths:
      - 'multiplayer/**'
      - '.github/workflows/multiplayer-tests.yml'
  pull_request:
    paths:
      - 'multiplayer/**'
      - '.github/workflows/multiplayer-tests.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multiplayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test
